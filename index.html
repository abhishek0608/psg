<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jewelet — handcrafted fine jewellery from Jaipur. Shop gold and silver rings, earrings, pendants, bracelets and necklaces."
    />
    <meta property="og:site_name" content="Jewelet" />
    <meta property="og:type" content="website" />

      property="og:description"

    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces carries the display voice: a variable old-style serif with an
         optical-size axis, so large headings pick up genuine high-contrast
         thick/thins instead of a scaled-up text face. Instrument Sans handles
         UI and body — a compact grotesque that stays legible at 11–13px, where
         most of this interface actually lives. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
    <!-- Must match SITE_NAME in src/composables/useSeo.ts: this is the title the
         browser paints before Vue mounts, so any mismatch flashes in the tab. -->
    <title>Jewelet — Fine Jewellery</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
