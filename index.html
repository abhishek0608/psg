<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jewelet — handcrafted fine jewellery from Bangkok. Shop gold and silver rings, earrings, pendants, bracelets and necklaces."
    />
    <meta property="og:site_name" content="Jewelet" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jewelet — Fine Jewellery" />
    <meta
      property="og:description"
      content="Jewelet — handcrafted fine jewellery from Bangkok. Shop gold and silver rings, earrings, pendants, bracelets and necklaces."
    />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Playfair Display carries the display voice: a high-contrast transitional
         serif with hairline thins and vertical stress — the drawing convention
         fine-jewellery houses use, and the reason a heading reads "atelier"
         rather than "artisan bakery". Variable 400..900 so headings can be set
         light at size and still hold weight at 18px.
         Jost handles UI and body: a geometric sans whose wide, even uppercase is
         built for the tracked-out nav labels and eyebrows this interface leans
         on, and which stays quiet next to a high-contrast serif. -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Jost:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
    <!-- Must match SITE_NAME in src/composables/useSeo.ts: this is the title the
         browser paints before Vue mounts, so any mismatch flashes in the tab. -->
    <title>Jewelet — Fine Jewellery</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
